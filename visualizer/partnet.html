<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Track2Art Simulation</title>
    <link rel="stylesheet" href="viewer-nav.css?v=1" />
    <link rel="stylesheet" href="viewer-nav.css?v=1" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #111925;
        color: #eef4fa;
        font:
          14px system-ui,
          sans-serif;
        color-scheme: dark;
      }
      header {
        min-height: 70px;
        padding: 12px 18px;
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
        border-bottom: 1px solid #2a3746;
      }
      .name {
        font-weight: 600;
      }
      .meta {
        color: #92a4b8;
        font-size: 12px;
        margin-top: 5px;
      }
      .modes {
        display: flex;
        gap: 3px;
        background: #090e15;
        padding: 4px;
        border-radius: 9px;
      }
      .stage {
        position: relative;
        background: radial-gradient(circle, #29394b, #101620);
      }
      canvas {
        display: block;
        width: 100%;
        height: 520px;
        touch-action: none;
        cursor: crosshair;
      }
      .tag,
      .hint {
        position: absolute;
        padding: 7px 9px;
        border-radius: 6px;
        background: #101722c9;
        font-size: 12px;
        color: #b8c8d9;
      }
      .tag {
        top: 14px;
        left: 16px;
      }
      .hint {
        bottom: 14px;
        left: 16px;
      }
      .controls {
        display: flex;
        gap: 6px;
        align-items: center;
        padding: 10px 16px;
        flex-wrap: wrap;
        border-top: 1px solid #2a3746;
      }
      button {
        font: inherit;
        color: #b8c8d9;
        background: transparent;
        border: 0;
        border-radius: 7px;
        min-height: 38px;
        padding: 8px 11px;
        cursor: pointer;
      }
      button[aria-pressed="true"] {
        background: #304740;
        color: #eafff7;
      }
      button:hover {
        background: #293747;
      }
      input {
        accent-color: #8ce4c7;
        flex: 1;
        min-width: 100px;
      }
      output {
        color: #9eafc2;
        font-size: 12px;
        min-width: 125px;
      }
      .legend {
        padding: 0 18px 12px;
        color: #91a3b6;
        font-size: 12px;
      }
      @media (max-width: 650px) {
        header {
          align-items: flex-start;
        }
        .modes {
          width: 100%;
        }
        .modes button {
          flex: 1;
          padding: 7px;
        }
        canvas {
          height: 420px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <div class="name">PART / MOTION</div>
        <div class="viewer-nav">
          <span
            ><a href="index.html?id=scene30">Real</a
            ><a class="active" href="partnet.html?id=102018"
              >PartNet-Mobility</a
            ></span
          >
          <span class="object-nav"
            ><a data-object="102018" href="partnet.html?id=102018"
              >Oven 102018</a
            ><a data-object="10620" href="partnet.html?id=10620"
              >Refrigerator 10620</a
            ></span
          >
        </div>
      </div>
      <div class="modes">
        <button data-mode="0" aria-pressed="true">RGB</button
        ><button data-mode="2" aria-pressed="false">4D point cloud</button
        ><button data-mode="3" aria-pressed="false">Track2Art</button>
      </div>
    </header>
    <div class="stage">
      <canvas
        aria-label="Simulated RGB, 4D point cloud, and Track2Art prediction"
        role="img"
      ></canvas
      ><span class="tag">PRIMARY CAMERA · RGB</span
      ><span class="hint">Click a predicted part · drag to orbit</span>
    </div>
    <div class="controls">
      <button data-part="0" aria-pressed="true">All parts</button
      ><button id="home" hidden>Reset view</button
      ><button id="play" aria-label="Pause">Ⅱ</button
      ><input id="time" type="range" min="0" value="0" /><output></output>
    </div>
    <div class="legend" aria-live="polite">Loading simulation…</div>
    <script src="viewer-config.js?v=1"></script>
    <script>
      const id = new URLSearchParams(location.search).get("id");
      if (!/^\d+$/.test(id || "")) throw Error("Invalid object id");
      const s = document.createElement("script");
      s.src = `assets/partnet-rgbd/${id}/data.js?v=4`;
      s.onload = () => {
        const v = document.createElement("script");
        v.src = "partnet-viewer.js?v=15";
        document.body.append(v);
      };
      document.body.append(s);
    </script>
    <script src="preload-assets.js?v=2" defer></script>
  </body>
</html>
